# terminal color fixes for neovim
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# change keybind for prefix key combination
set -s escape-time 0
set -g prefix C-s

# reconfiguring the reload key to reload the config file on reload
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# enable mouse mode
set -g mouse on
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# rebinding the split vertical/horizontal to v and h respectively
unbind v
unbind h
unbind % # Split vertically
unbind '"' # Split horizontally
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"

# bind selecting panels with tmux
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set more History
set -g history-limit 10000

# change default first window to 1
set -g base-index 1
set-window-option -g pane-base-index 1

# change to next & preivous windows with alt+k & alt+j
bind -n M-j previous-window
bind -n M-k next-window
# create new window
unbind 'M-c'
bind -n M-c new-window

# DESIGN TWEAKS
# Do nothing when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour purple

# copy mode
setw -g mode-style 'fg=black bg=orange bold'

# panes
set -g pane-border-style 'fg=purple'
set -g pane-active-border-style 'fg=orange'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=orange'

set -g status-left ''
set -g status-left-length 10

set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-style 'fg=black bg=purple'
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=orange'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=orange bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=purple]#F '

setw -g window-status-bell-style 'fg=black bg=orange bold'

# messages
set -g message-style 'fg=black bg=orange bold'
